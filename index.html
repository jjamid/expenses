<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monthly Expenses</title>
<style>
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#1d2b2a; --muted:#5d6e6c; --line:#d9e0de;
  --accent:#0f6b63; --accent-ink:#ffffff; --danger:#a63d2f; --field:#f8faf9;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101716; --surface:#192322; --ink:#e8f0ee; --muted:#9bb0ac; --line:#2c3a38;
    --accent:#4fc3b5; --accent-ink:#06201d; --danger:#ee8a7a; --field:#142120;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101716; --surface:#192322; --ink:#e8f0ee; --muted:#9bb0ac; --line:#2c3a38;
  --accent:#4fc3b5; --accent-ink:#06201d; --danger:#ee8a7a; --field:#142120;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:920px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:1.05rem;margin:0 0 12px}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.total .big{font-size:2.2rem;font-weight:700;color:var(--accent);letter-spacing:-.02em}
.total .lbl{color:var(--muted)}
.addrow{display:grid;grid-template-columns:2fr 1.3fr 1fr auto;gap:8px}
input,select,button{font:inherit;color:var(--ink)}
input,select{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
button.del{background:none;border:0;color:var(--danger);cursor:pointer;font-size:1.2rem;padding:6px 10px;border-radius:8px}
button.del:hover{background:var(--field)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.9rem;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
th.num,td.num{text-align:right}
td input.name{border-color:transparent;background:transparent}
td input.name:hover,td input.name:focus{background:var(--field);border-color:var(--line)}
td .amt{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;border-bottom:0;padding-top:12px}
.empty{color:var(--muted);padding:20px 6px;text-align:center}
.chart{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:20px;align-items:center}
.chart svg{width:100%;height:auto;display:block}
.legend{list-style:none;margin:0;padding:0}
.legend li{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.legend li:last-child{border-bottom:0}
.sw{width:14px;height:14px;border-radius:4px}
.legend .pct{color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.legend .sum{font-weight:600;font-variant-numeric:tabular-nums}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.bar h2{margin:0}
.bar .right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#status{color:var(--muted);font-size:.85rem}
button.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button.ghost:hover{background:var(--field)}
.imp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.imp[hidden]{display:none}
.imp span{flex:1 1 180px}
.authrow{grid-template-columns:2fr 2fr auto auto}
#authMsg{margin:10px 0 0;min-height:1.4em}
@media (max-width:640px){
  .authrow{grid-template-columns:1fr}
  .addrow{grid-template-columns:1fr 1fr}
  .addrow input:first-child{grid-column:1 / -1}
  .chart{grid-template-columns:1fr}
  .chart svg{max-width:260px;margin:0 auto}
}
</style>
</head>
<body>
<main>
  <h1>Monthly expenses</h1>
  <p class="sub">Add an expense, pick a category, and edit any amount in the table.</p>

  <section class="panel" id="auth">
    <h2>Sign in to see your expenses</h2>
    <div class="addrow authrow">
      <input id="email" type="email" autocomplete="email" placeholder="Email" aria-label="Email">
      <input id="password" type="password" autocomplete="current-password" placeholder="Password (8+ characters)" aria-label="Password">
      <button class="primary" id="signInBtn" type="button">Sign in</button>
      <button class="ghost" id="signUpBtn" type="button">Create account</button>
    </div>
    <p class="sub" id="authMsg" role="status"></p>
  </section>

  <div id="app" hidden>

  <section class="panel total" aria-live="polite">
    <span class="lbl">Total per month</span>
    <span class="big" id="total">$0.00</span>
  </section>

  <section class="panel">
    <h2>Add expense</h2>
    <div class="addrow">
      <input id="newName" type="text" placeholder="Expense name" aria-label="Expense name">
      <select id="newCat" aria-label="Category"></select>
      <input id="newAmt" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Amount" aria-label="Amount">
      <button class="primary" id="addBtn" type="button">Add expense</button>
    </div>
  </section>

  <section class="panel">
    <div class="bar">
      <h2>Expenses</h2>
      <div class="right">
        <span id="status" aria-live="polite"></span>
        <button class="ghost" id="importBtn" type="button">Import CSV</button>
        <input type="file" id="fileIn" accept=".csv,text/csv,text/plain" hidden>
        <button class="ghost" id="exportBtn" type="button">Download CSV</button>
        <button class="ghost" id="signOutBtn" type="button">Sign out</button>
      </div>
    </div>
    <div class="imp" id="impBar" hidden>
      <span id="impMsg"></span>
      <button class="primary" id="impAdd" type="button">Add to list</button>
      <button class="ghost" id="impRep" type="button">Replace list</button>
      <button class="ghost" id="impCancel" type="button">Cancel</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Name</th><th>Category</th><th class="num">Amount</th><th><span class="sr" style="position:absolute;left:-9999px">Delete</span></th></tr></thead>
        <tbody id="rows"></tbody>
        <tfoot><tr><td colspan="2">Total</td><td class="num" id="footTotal">$0.00</td><td></td></tr></tfoot>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>By category</h2>
    <div class="chart">
      <div id="pie"></div>
      <ul class="legend" id="legend"></ul>
    </div>
  </section>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  // 1. Paste your Supabase project URL and anon (publishable) key here.
  var SUPABASE_URL = "https://pselbixltxwgrynaituu.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_rilL-t-EZB4yEUDbcgX5EA_VX_HRK5N";

  var CATS = [
    ["Housing","#0f6b63"],["Utilities","#d98e04"],["Groceries","#6a9f3a"],["Transport","#2f6fb0"],
    ["Insurance","#7a4fa3"],["Subscriptions","#c4467a"],["Health","#d1553c"],["Education","#3a8fa3"],
    ["Family","#a67c52"],["Debt","#5a6470"],["Other","#8a9a98"]
  ];
  var KEY = "monthly-expenses-v1";
  var items = [];
  var fmt = new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ var p = JSON.parse(raw); if(Array.isArray(p)) items = p; }
    }catch(e){}
  }
  function save(){
    scheduleDb();
  }
  function color(cat){
    for(var i=0;i<CATS.length;i++) if(CATS[i][0]===cat) return CATS[i][1];
    return "#8a9a98";
  }
  function catOptions(sel, selected){
    sel.innerHTML = "";
    CATS.forEach(function(c){
      var o = document.createElement("option");
      o.value = c[0]; o.textContent = c[0];
      if(c[0]===selected) o.selected = true;
      sel.appendChild(o);
    });
  }

  var rowsEl = document.getElementById("rows");

  function renderRows(){
    rowsEl.innerHTML = "";
    if(!items.length){
      var tr = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = 4; td.className = "empty";
      td.textContent = "No expenses yet. Add your first one above.";
      tr.appendChild(td); rowsEl.appendChild(tr);
      return;
    }
    items.forEach(function(it, idx){
      var tr = document.createElement("tr");

      var t1 = document.createElement("td");
      var name = document.createElement("input");
      name.type = "text"; name.className = "name"; name.value = it.name;
      name.setAttribute("aria-label","Expense name");
      name.addEventListener("input", function(){ it.name = name.value; save(); });
      t1.appendChild(name);

      var t2 = document.createElement("td");
      var sel = document.createElement("select");
      sel.setAttribute("aria-label","Category");
      catOptions(sel, it.cat);
      sel.addEventListener("change", function(){ it.cat = sel.value; save(); renderSummary(); });
      t2.appendChild(sel);

      var t3 = document.createElement("td"); t3.className = "num";
      var amt = document.createElement("input");
      amt.type = "number"; amt.min = "0"; amt.step = "0.01"; amt.inputMode = "decimal";
      amt.className = "amt"; amt.value = it.amount;
      amt.setAttribute("aria-label","Amount");
      amt.addEventListener("input", function(){
        var v = parseFloat(amt.value);
        it.amount = isNaN(v) ? 0 : v;
        save(); renderSummary();
      });
      t3.appendChild(amt);

      var t4 = document.createElement("td");
      var del = document.createElement("button");
      del.type = "button"; del.className = "del"; del.textContent = "\u00d7";
      del.setAttribute("aria-label","Delete " + (it.name || "expense"));
      del.addEventListener("click", function(){
        items.splice(idx,1); save(); renderRows(); renderSummary();
      });
      t4.appendChild(del);

      tr.appendChild(t1); tr.appendChild(t2); tr.appendChild(t3); tr.appendChild(t4);
      rowsEl.appendChild(tr);
    });
  }

  function pieSvg(data, total){
    var s = '<svg viewBox="0 0 200 200" role="img" aria-label="Pie chart of expenses by category">';
    if(total <= 0){
      s += '<circle cx="100" cy="100" r="90" fill="none" stroke="var(--line)" stroke-width="2"/>';
      s += '<text x="100" y="105" text-anchor="middle" fill="var(--muted)" font-size="13">No data yet</text>';
    } else if(data.length === 1){
      s += '<circle cx="100" cy="100" r="90" fill="' + data[0].color + '"/>';
    } else {
      var a0 = -Math.PI/2;
      data.forEach(function(d){
        var a1 = a0 + (d.sum/total) * Math.PI * 2;
        var x0 = 100 + 90*Math.cos(a0), y0 = 100 + 90*Math.sin(a0);
        var x1 = 100 + 90*Math.cos(a1), y1 = 100 + 90*Math.sin(a1);
        var large = (a1 - a0) > Math.PI ? 1 : 0;
        s += '<path d="M100 100 L' + x0.toFixed(2) + ' ' + y0.toFixed(2) +
             ' A90 90 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) +
             ' Z" fill="' + d.color + '" stroke="var(--surface)" stroke-width="2"/>';
        a0 = a1;
      });
    }
    return s + '</svg>';
  }

  function renderSummary(){
    var total = 0, sums = {};
    items.forEach(function(it){
      var v = Number(it.amount) || 0;
      total += v;
      sums[it.cat] = (sums[it.cat] || 0) + v;
    });
    document.getElementById("total").textContent = fmt.format(total);
    document.getElementById("footTotal").textContent = fmt.format(total);

    var data = CATS.map(function(c){ return {cat:c[0], color:c[1], sum:sums[c[0]] || 0}; })
      .filter(function(d){ return d.sum > 0; })
      .sort(function(a,b){ return b.sum - a.sum; });

    document.getElementById("pie").innerHTML = pieSvg(data, total);

    var lg = document.getElementById("legend");
    lg.innerHTML = "";
    if(!data.length){
      var li = document.createElement("li");
      li.style.display = "block"; li.style.color = "var(--muted)";
      li.textContent = "Category totals appear here once you add amounts.";
      lg.appendChild(li);
      return;
    }
    data.forEach(function(d){
      var li = document.createElement("li");
      var sw = document.createElement("span"); sw.className = "sw"; sw.style.background = d.color;
      var nm = document.createElement("span"); nm.textContent = d.cat;
      var pc = document.createElement("span"); pc.className = "pct"; pc.textContent = Math.round(d.sum/total*100) + "%";
      var sm = document.createElement("span"); sm.className = "sum"; sm.textContent = fmt.format(d.sum);
      li.appendChild(sw); li.appendChild(nm); li.appendChild(pc); li.appendChild(sm);
      lg.appendChild(li);
    });
  }

  var newName = document.getElementById("newName");
  var newCat = document.getElementById("newCat");
  var newAmt = document.getElementById("newAmt");
  catOptions(newCat, "Housing");

  function add(){
    var n = newName.value.trim();
    if(!n){ newName.focus(); return; }
    var v = parseFloat(newAmt.value);
    items.push({name:n, cat:newCat.value, amount:isNaN(v) ? 0 : v});
    save();
    newName.value = ""; newAmt.value = "";
    renderRows(); renderSummary();
    newName.focus();
  }
  document.getElementById("addBtn").addEventListener("click", add);
  [newName, newAmt].forEach(function(el){
    el.addEventListener("keydown", function(e){ if(e.key === "Enter") add(); });
  });

  var sb = null, session = null, dirty = false, writing = false, timer = null;
  var statusEl = document.getElementById("status");
  var authEl = document.getElementById("auth");
  var appEl = document.getElementById("app");
  var authMsgEl = document.getElementById("authMsg");
  function setStatus(t){ statusEl.textContent = t; }
  function authMsg(t){ authMsgEl.textContent = t; }

  function clean(arr){
    return arr.map(function(x){
      return {name:String(x && x.name || ""), cat:String(x && x.cat || "Other"), amount:Number(x && x.amount) || 0};
    });
  }
  function scheduleDb(){
    if(!session) return;
    dirty = true; setStatus("Saving\u2026");
    clearTimeout(timer); timer = setTimeout(flush, 600);
  }
  async function flush(){
    if(!session){ dirty = false; return; }
    if(writing){ timer = setTimeout(flush, 500); return; }
    writing = true;
    var snapStr = JSON.stringify(items);
    var res = await sb.from("expense_lists").upsert({
      user_id: session.user.id,
      items: JSON.parse(snapStr),
      updated_at: new Date().toISOString()
    });
    writing = false;
    if(res.error){ dirty = false; setStatus("Couldn\u2019t save: " + res.error.message); return; }
    if(JSON.stringify(items) === snapStr){ dirty = false; setStatus("Saved"); }
    else { scheduleDb(); }
  }
  async function loadList(){
    setStatus("Loading\u2026");
    var res = await sb.from("expense_lists").select("items").maybeSingle();
    if(res.error){ setStatus("Couldn\u2019t load: " + res.error.message); return; }
    items = (res.data && Array.isArray(res.data.items)) ? clean(res.data.items) : [];
    renderRows(); renderSummary(); setStatus("Saved");
  }
  function showSignedIn(on){ authEl.hidden = on; appEl.hidden = !on; }

  function startAuth(){
    if(!window.supabase || SUPABASE_URL.indexOf("PASTE") === 0 || SUPABASE_ANON_KEY.indexOf("PASTE") === 0){
      authMsg("Setup needed: add your Supabase project URL and key at the top of the script.");
      return;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    sb.auth.onAuthStateChange(function(event, s){
      var before = session && session.user.id;
      session = s;
      if(s){
        showSignedIn(true);
        if(before !== s.user.id) setTimeout(loadList, 0);
      } else {
        items = []; renderRows(); renderSummary(); showSignedIn(false);
      }
    });
  }
  function creds(){
    return {email: document.getElementById("email").value.trim(), password: document.getElementById("password").value};
  }
  document.getElementById("signInBtn").addEventListener("click", async function(){
    if(!sb) return;
    authMsg("Signing in\u2026");
    var r = await sb.auth.signInWithPassword(creds());
    authMsg(r.error ? r.error.message : "");
  });
  document.getElementById("signUpBtn").addEventListener("click", async function(){
    if(!sb) return;
    authMsg("Creating account\u2026");
    var c = creds();
    var r = await sb.auth.signUp({email: c.email, password: c.password, options: {emailRedirectTo: window.location.origin + window.location.pathname}});
    if(r.error){ authMsg(r.error.message); return; }
    authMsg(r.data.session ? "" : "Check your email to confirm your account, then sign in.");
  });
  document.getElementById("password").addEventListener("keydown", function(e){
    if(e.key === "Enter") document.getElementById("signInBtn").click();
  });
  document.getElementById("signOutBtn").addEventListener("click", function(){
    if(sb) sb.auth.signOut();
  });

  function csvCell(v){
    var t = String(v);
    if(/^[=+\-@]/.test(t)) t = "'" + t;
    return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }
  document.getElementById("exportBtn").addEventListener("click", function(){
    var lines = ["Name,Category,Amount"].concat(items.map(function(it){
      return [csvCell(it.name), csvCell(it.cat), (Number(it.amount) || 0).toFixed(2)].join(",");
    }));
    var blob = new Blob([lines.join("\n")], {type:"text/csv"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "monthly-expenses.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });

  //PARSE-START
  function parseCsv(text){
    var rows = [], row = [], cell = "", q = false, i, c;
    var NL = String.fromCharCode(10), CR = String.fromCharCode(13), DQ = String.fromCharCode(34);
    if(text.charCodeAt(0) === 65279) text = text.slice(1);
    for(i = 0; i < text.length; i++){
      c = text.charAt(i);
      if(q){
        if(c === DQ){
          if(text.charAt(i + 1) === DQ){ cell += DQ; i++; } else { q = false; }
        } else { cell += c; }
      } else if(c === DQ){ q = true; }
      else if(c === ","){ row.push(cell); cell = ""; }
      else if(c === NL || c === CR){
        if(c === CR && text.charAt(i + 1) === NL) i++;
        row.push(cell); cell = ""; rows.push(row); row = [];
      } else { cell += c; }
    }
    if(cell !== "" || row.length){ row.push(cell); rows.push(row); }
    return rows;
  }
  function matchCat(t){
    var k = String(t || "").trim().toLowerCase();
    for(var i = 0; i < CATS.length; i++) if(CATS[i][0].toLowerCase() === k) return CATS[i][0];
    return "Other";
  }
  function toItems(rows){
    var out = [];
    rows.forEach(function(r, idx){
      if(!r || r.length < 2) return;
      var name = String(r[0] || "").trim();
      if(!name) return;
      var cat = "Other", amtStr;
      if(r.length >= 3){ cat = matchCat(r[1]); amtStr = r[2]; } else { amtStr = r[1]; }
      var v = parseFloat(String(amtStr).replace(/[^0-9.-]/g, ""));
      if(idx === 0 && isNaN(v)) return;
      if(name.charAt(0) === "'") name = name.slice(1);
      out.push({name: name, cat: cat, amount: isNaN(v) ? 0 : v});
    });
    return out.slice(0, 500);
  }
  //PARSE-END

  var pendingImport = null;
  var impBar = document.getElementById("impBar");
  var fileIn = document.getElementById("fileIn");
  function closeImport(){ pendingImport = null; impBar.hidden = true; }
  function applyImport(replace){
    if(!pendingImport) return;
    var n = pendingImport.length;
    items = replace ? pendingImport : items.concat(pendingImport);
    closeImport();
    save(); renderRows(); renderSummary();
  }
  document.getElementById("importBtn").addEventListener("click", function(){ fileIn.click(); });
  document.getElementById("impAdd").addEventListener("click", function(){ applyImport(false); });
  document.getElementById("impRep").addEventListener("click", function(){ applyImport(true); });
  document.getElementById("impCancel").addEventListener("click", closeImport);
  fileIn.addEventListener("change", function(){
    var f = fileIn.files && fileIn.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      var found = toItems(parseCsv(String(reader.result || "")));
      fileIn.value = "";
      if(!found.length){
        closeImport();
        setStatus("No expenses found. Use columns: Name, Category, Amount.");
        return;
      }
      pendingImport = found;
      document.getElementById("impMsg").textContent = "Found " + found.length + (found.length === 1 ? " expense" : " expenses") + " in " + f.name + ".";
      impBar.hidden = false;
    };
    reader.onerror = function(){ setStatus("Couldn\u2019t read that file"); };
    reader.readAsText(f);
  });

  renderRows();
  renderSummary();
  startAuth();
})();
</script>
</body>
</html>
